<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="utf-8">

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <title>App Store Review Analysis</title>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 32px;
                font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                background: #f5f7fa;
                color: #1f2937;
            }

            .container {
                max-width: 1200px;
                margin: 0 auto;
            }

            h1 {
                margin: 0 0 8px;
                font-size: 32px;
            }

            .subtitle {
                margin: 0 0 32px;
                color: #6b7280;
            }

            .charts {
                display: grid;
                grid-template-columns: repeat(
                    auto-fit,
                    minmax(450px, 1fr)
                );
                gap: 24px;
            }

            .chart-card {
                background: #ffffff;
                border: 1px solid #e5e7eb;
                border-radius: 12px;
                padding: 20px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            }

            .chart-card.full-width {
                grid-column: 1 / -1;
            }

            .chart-card h2 {
                margin: 0 0 16px;
                font-size: 18px;
            }

            .chart-container {
                width: 100%;
                overflow-x: auto;
            }

            .chart-container img {
                display: block;
                width: 100%;
                height: auto;
                max-width: 100%;
            }

            @media (max-width: 700px) {
                body {
                    padding: 16px;
                }

                .charts {
                    grid-template-columns: 1fr;
                }

                .chart-card {
                    padding: 12px;
                }

                h1 {
                    font-size: 24px;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">

            <h1>App Store Review Analysis</h1>

            <p class="subtitle">
                Metrics, sentiment analysis and negative review topics
            </p>

            <div class="charts">

                <div class="chart-card">
                    <h2>Rating Distribution</h2>
                    <div class="chart-container">
                        <img
                            src="/api/visualizations/rating-distribution"
                            alt="Rating distribution"
                        >
                    </div>
                </div>

                <div class="chart-card">
                    <h2>Sentiment Distribution</h2>
                    <div class="chart-container">
                        <img
                            src="/api/visualizations/sentiment-distribution"
                            alt="Sentiment distribution"
                        >
                    </div>
                </div>

                <div class="chart-card">
                    <h2>Sentiment by Rating</h2>
                    <div class="chart-container">
                        <img
                            src="/api/visualizations/sentiment-by-rating"
                            alt="Sentiment by rating"
                        >
                    </div>
                </div>

                <div class="chart-card">
                    <h2>Top Negative Keywords</h2>
                    <div class="chart-container">
                        <img
                            src="/api/visualizations/top-negative-terms?kind=keywords"
                            alt="Top negative keywords"
                        >
                    </div>
                </div>

                <div class="chart-card full-width">
                    <h2>Top Negative Phrases</h2>
                    <div class="chart-container">
                        <img
                            src="/api/visualizations/top-negative-terms?kind=phrases"
                            alt="Top negative phrases"
                        >
                    </div>
                </div>

            </div>
        </div>
    </body>
    </html>
